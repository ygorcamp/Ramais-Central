<title>Filiais de Venda · Grupo Líder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --bg: #f5efe2;
    --bg-deep: #ece0c8;
    --surface: #fffdf8;
    --ink: #2a1c14;
    --ink-soft: #5c4a3a;
    --muted: #8f7f68;
    --line: rgba(42,28,20,0.14);
    --primary: #7a1f2b;
    --primary-dark: #401019;
    --primary-tint: #f4e4e2;
    --gold: #b3841f;
    --gold-tint: #f6ecd6;
    --green: #2c6349;
    --green-tint: #e2ede5;
    --terra: #a84e29;
    --terra-tint: #f3e2d6;
    --shadow: 0 1px 2px rgba(42,20,10,0.06), 0 8px 24px -12px rgba(42,20,10,0.22);
  }

  *{ box-sizing:border-box; }
  html{ scroll-behavior:smooth; }
  body{
    margin:0;
    background:
      radial-gradient(ellipse 1200px 600px at 15% -10%, rgba(122,31,43,0.06), transparent 60%),
      var(--bg);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  ::selection{ background:var(--primary); color:#fff; }

  /* ---------- HERO ---------- */
  header.hero{
    position:relative;
    background:
      radial-gradient(circle at 82% 18%, rgba(255,255,255,0.08), transparent 45%),
      linear-gradient(150deg, var(--primary) 0%, var(--primary-dark) 78%);
    color:#fbf3ee;
    overflow:hidden;
    padding:clamp(28px,5vw,52px) 20px clamp(40px,6vw,64px);
  }
  header.hero::after{
    content:"";
    position:absolute; inset:0;
    background-image: radial-gradient(rgba(255,255,255,0.10) 1px, transparent 1.4px);
    background-size:16px 16px;
    opacity:.35;
    pointer-events:none;
  }
  .hero-inner{
    position:relative;
    max-width:1080px;
    margin:0 auto;
    display:flex;
    align-items:center;
    gap:22px;
    flex-wrap:wrap;
  }
  .hero-logo{
    width:112px;
    height:112px;
    object-fit:contain;
    border-radius:18px;
    background:#fffdf8;
    padding:12px;
    box-shadow:0 10px 26px rgba(0,0,0,0.32), 0 0 0 1px rgba(255,255,255,0.5);
    flex-shrink:0;
  }
  .hero-text{ flex:1; min-width:240px; }
  .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:.72rem;
    letter-spacing:.22em;
    text-transform:uppercase;
    color:#e9c8b4;
    margin:0 0 6px;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .eyebrow::before{
    content:"";
    width:22px; height:1px;
    background:#e9c8b4;
    display:inline-block;
  }
  header.hero h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-optical-sizing:auto;
    font-size:clamp(2rem,5vw,3.1rem);
    letter-spacing:-0.01em;
    margin:0 0 6px;
    line-height:1.02;
  }
  header.hero p.sub{
    margin:0;
    font-size:1rem;
    color:#f0d9cd;
    max-width:46ch;
  }

  /* ---------- TOOLBAR ---------- */
  .toolbar-wrap{
    position:sticky;
    top:0;
    z-index:20;
    background:rgba(245,239,226,0.92);
    backdrop-filter:blur(10px) saturate(1.1);
    border-bottom:1px solid var(--line);
  }
  .toolbar{
    max-width:1080px;
    margin:0 auto;
    padding:16px 20px;
  }
  .search-row{
    position:relative;
    display:flex;
    align-items:center;
  }
  .search-row svg{
    position:absolute;
    left:16px;
    width:18px; height:18px;
    color:var(--muted);
    pointer-events:none;
  }
  #search{
    width:100%;
    padding:13px 16px 13px 46px;
    font-family:'Inter',sans-serif;
    font-size:1rem;
    color:var(--ink);
    background:var(--surface);
    border:1.5px solid var(--line);
    border-radius:12px;
    outline:none;
    box-shadow:var(--shadow);
    transition:border-color .18s, box-shadow .18s;
  }
  #search::placeholder{ color:var(--muted); }
  #search:focus{
    border-color:var(--primary);
    box-shadow:0 0 0 4px var(--primary-tint);
  }
  #search:focus-visible{ outline:2px solid var(--primary); outline-offset:2px; }

  .tabs{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-top:14px;
  }
  .tab-btn{
    display:inline-flex;
    align-items:center;
    gap:7px;
    padding:8px 14px 8px 12px;
    border-radius:999px;
    border:1.5px solid var(--line);
    background:var(--surface);
    cursor:pointer;
    font-family:'Inter',sans-serif;
    font-size:.82rem;
    font-weight:600;
    color:var(--ink-soft);
    transition:transform .12s ease, border-color .15s, color .15s, background .15s;
  }
  .tab-btn .dot{
    width:8px; height:8px;
    border-radius:50%;
    background:var(--tab-color,var(--primary));
    flex-shrink:0;
  }
  .tab-btn .n{
    font-family:'IBM Plex Mono',monospace;
    font-weight:500;
    color:var(--muted);
    font-size:.76rem;
  }
  .tab-btn:hover{ border-color:var(--tab-color,var(--primary)); transform:translateY(-1px); }
  .tab-btn:focus-visible{ outline:2px solid var(--primary); outline-offset:2px; }
  .tab-btn.active{
    background:var(--tab-color,var(--primary));
    border-color:var(--tab-color,var(--primary));
    color:#fff;
  }
  .tab-btn.active .n{ color:rgba(255,255,255,0.85); }

  /* ---------- CONTENT ---------- */
  .container{
    max-width:1080px;
    margin:0 auto;
    padding:26px 20px 70px;
  }
  .count-row{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:14px;
    color:var(--muted);
    font-size:.86rem;
  }
  .count-row strong{ color:var(--ink); font-weight:700; }

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(268px,1fr));
    gap:12px;
  }

  .card{
    --cat-color: var(--primary);
    --cat-tint: var(--primary-tint);
    position:relative;
    display:flex;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:12px;
    overflow:hidden;
    box-shadow:var(--shadow);
    opacity:0;
    transform:translateY(6px);
    animation:riseIn .38s ease forwards;
    animation-delay:calc(var(--i,0) * 16ms);
  }
  @keyframes riseIn{
    to{ opacity:1; transform:translateY(0); }
  }
  @media (prefers-reduced-motion: reduce){
    .card{ animation:none; opacity:1; transform:none; }
    html{ scroll-behavior:auto; }
  }

  .card .tag{
    flex:0 0 74px;
    position:relative;
    background:var(--cat-tint);
    display:flex;
    align-items:center;
    justify-content:center;
    border-right:1.5px dashed rgba(42,28,20,0.22);
  }
  .card .tag::before,
  .card .tag::after{
    content:"";
    position:absolute;
    right:-7px;
    width:14px; height:14px;
    background:var(--bg);
    border-radius:50%;
    border:1px solid var(--line);
  }
  .card .tag::before{ top:-7px; }
  .card .tag::after{ bottom:-7px; }
  .card .code{
    font-family:'IBM Plex Mono',monospace;
    font-weight:600;
    font-size:.95rem;
    color:var(--cat-color);
    letter-spacing:.02em;
    writing-mode:horizontal-tb;
  }
  .card .body{
    flex:1;
    padding:14px 16px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    gap:5px;
    min-width:0;
  }
  .card .name{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:1.05rem;
    line-height:1.2;
    color:var(--ink);
    overflow-wrap:break-word;
  }
  .card .cat{
    font-size:.68rem;
    font-weight:600;
    letter-spacing:.07em;
    text-transform:uppercase;
    color:var(--cat-color);
  }
  .card:hover{
    border-color:var(--cat-color);
    transform:translateY(-2px);
    box-shadow:0 2px 4px rgba(42,20,10,0.08), 0 14px 28px -14px rgba(42,20,10,0.32);
  }
  .card{ transition:transform .16s ease, box-shadow .16s ease, border-color .16s ease; }

  .empty{
    text-align:center;
    padding:60px 20px;
    color:var(--muted);
  }
  .empty .glyph{
    font-family:'Fraunces',serif;
    font-size:2.4rem;
    color:var(--primary);
    margin-bottom:10px;
  }
  .empty p{ margin:4px 0 0; font-size:.92rem; }

  footer{
    text-align:center;
    color:var(--muted);
    font-size:.76rem;
    padding:26px 20px 34px;
    border-top:1px solid var(--line);
  }

  @media (max-width:480px){
    .hero-inner{ text-align:center; justify-content:center; }
    .hero-logo{ width:88px; height:88px; margin:0 auto; }
    .eyebrow{ justify-content:center; }
  }
</style>

</head>

const CATEGORY_STYLE = {
  "Todas":                     { color: "#7a1f2b", tint: "#f4e4e2" },
  "SUPERMERCADO & MAGAZAN":    { color: "#7a1f2b", tint: "#f4e4e2" },
  "SUPERMERCADO":              { color: "#2c6349", tint: "#e2ede5" },
  "MAGAZAN":                   { color: "#b3841f", tint: "#f6ecd6" },
  "JERÔNIMO'S RESTAURANT":     { color: "#a84e29", tint: "#f3e2d6" },
};
function styleFor(name){
  return CATEGORY_STYLE[name] || { color: "#7a1f2b", tint: "#f4e4e2" };
}

const tabsEl = document.getElementById('tabs');
const gridEl = document.getElementById('grid');
const searchEl = document.getElementById('search');
const countEl = document.getElementById('count');

let currentTab = 'Todas';

function makeTabs(){
  Object.keys(DATA).forEach(name => {
    const st = styleFor(name);
    const btn = document.createElement('button');
    btn.className = 'tab-btn' + (name === currentTab ? ' active' : '');
    btn.style.setProperty('--tab-color', st.color);
    btn.innerHTML = `<span class="dot"></span>${name}<span class="n">${DATA[name].length}</span>`;
    btn.onclick = () => {
      currentTab = name;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      render();
    };
    tabsEl.appendChild(btn);
  });
}

function render(){
  const query = searchEl.value.trim().toLowerCase();
  const rows = DATA[currentTab].filter(([cod, loja]) => {
    if (!query) return true;
    return cod.toLowerCase().includes(query) || loja.toLowerCase().includes(query);
  });

  const st = styleFor(currentTab);

  if (rows.length === 0) {
    gridEl.innerHTML = `
      <div class="empty" style="grid-column:1/-1">
        <div class="glyph">∅</div>
        <p>Nenhuma loja encontrada para "${searchEl.value.trim()}"</p>
      </div>`;
  } else {
    gridEl.innerHTML = rows.map(([cod, loja], i) => `
      <div class="card" style="--i:${i}; --cat-color:${st.color}; --cat-tint:${st.tint}">
        <div class="tag"><span class="code">${cod}</span></div>
        <div class="body">
          <div class="name">${loja}</div>
          <div class="cat">${currentTab}</div>
        </div>
      </div>
    `).join('');
  }
  countEl.innerHTML = `<strong>${rows.length}</strong> loja${rows.length === 1 ? '' : 's'} encontrada${rows.length === 1 ? '' : 's'}`;
}

searchEl.addEventListener('input', render);
makeTabs();
render();
</script>
