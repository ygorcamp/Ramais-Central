<style>
  :root{
    --bg:#F2F4F7;
    --surface:#FFFFFF;
    --ink:#151B24;
    --muted:#5B6472;
    --muted-soft:#8A93A3;
    --line:#E2E6EC;
    --navy:#152A42;
    --navy-deep:#0D1D30;
    --navy-line:rgba(255,255,255,.09);
    --brass:#B9862E;
    --brass-ink:#7A5A1E;
    --brass-tint:#F6ECD8;
    --focus:#2B6CB0;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{font-family:'Libre Franklin',system-ui,sans-serif;margin:0;}
  button{font-family:inherit;}
  ::selection{background:var(--brass-tint);color:var(--brass-ink);}

  a:focus-visible, button:focus-visible, input:focus-visible{
    outline:2px solid var(--focus);
    outline-offset:2px;
  }

  .app{
    display:flex;
    align-items:flex-start;
    max-width:1240px;
    margin:0 auto;
    min-height:100vh;
  }

  /* ---------- RAIL (índice de setores) ---------- */
  .rail{
    flex:0 0 272px;
    background:linear-gradient(180deg,var(--navy) 0%,var(--navy-deep) 100%);
    color:#EDF1F6;
    position:sticky;
    top:0;
    height:100vh;
    display:flex;
    flex-direction:column;
    border-right:1px solid rgba(0,0,0,.15);
  }
  .brand{
    padding:28px 24px 20px;
    border-bottom:1px solid var(--navy-line);
  }
  .brand-eyebrow{
    display:block;
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:.14em;
    color:#9FB2C9;
    margin-bottom:8px;
  }
  .brand-name{
    font-size:24px;
    font-weight:800;
    letter-spacing:-.01em;
    color:#fff;
  }
  .brand-logo{
    display:block;
    width:100%;
    max-width:220px;
    height:auto;
    object-fit:contain;
    object-position:left center;
  }

  .brand-sub{
    margin:6px 0 0;
    font-size:12.5px;
    color:#AEBBCB;
    font-weight:500;
  }
  .index-scroll{
    flex:1;
    overflow-y:auto;
    padding:10px 0 18px;
  }
  .index-scroll::-webkit-scrollbar{width:8px;}
  .index-scroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:8px;}

  .index-item{
    all:unset;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    width:100%;
    padding:9px 22px 9px 20px;
    border-left:3px solid transparent;
    font-size:13.5px;
    font-weight:500;
    color:#C4CEDC;
    cursor:pointer;
    line-height:1.35;
  }
  .index-item .index-label{
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .index-item .index-count{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:#8496AC;
    flex:0 0 auto;
  }
  .index-item:hover{
    background:rgba(255,255,255,.05);
    color:#fff;
  }
  .index-item.active{
    background:rgba(185,134,46,.14);
    border-left-color:var(--brass);
    color:#fff;
  }
  .index-item.active .index-count{color:var(--brass);}
  .index-item.all{
    font-weight:700;
    text-transform:uppercase;
    font-size:11.5px;
    letter-spacing:.06em;
    border-bottom:1px solid var(--navy-line);
    padding-bottom:13px;
    margin-bottom:6px;
  }

  /* chips horizontais para telas pequenas */
  .mobile-index{
    display:none;
  }

  /* ---------- MAIN ---------- */
  .main{
    flex:1;
    min-width:0;
    padding:28px 32px 60px;
  }
  .toolbar{
    position:sticky;
    top:0;
    background:var(--bg);
    padding:0 0 16px;
    z-index:5;
  }
  .toolbar-title{
    font-size:12px;
    font-weight:700;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--muted-soft);
    margin-bottom:14px;
  }
  .search-row{
    display:flex;
    gap:12px;
    align-items:center;
    flex-wrap:wrap;
  }
  .search-wrap{
    flex:1 1 320px;
    position:relative;
    display:flex;
    align-items:center;
  }
  .search-wrap svg{
    position:absolute;
    left:14px;
    width:16px;
    height:16px;
    color:var(--muted-soft);
    pointer-events:none;
  }
  .search-wrap input{
    width:100%;
    padding:12px 14px 12px 40px;
    border-radius:var(--radius);
    border:1px solid var(--line);
    background:var(--surface);
    font-size:14.5px;
    color:var(--ink);
    box-shadow:0 1px 2px rgba(16,24,40,.04);
  }
  .search-wrap input::placeholder{color:var(--muted-soft);}
  .search-wrap input:focus{border-color:var(--focus);}

  .stats-row{
    display:flex;
    align-items:center;
    gap:14px;
    flex:0 0 auto;
  }
  #count-badge{
    font-family:'IBM Plex Mono',monospace;
    font-size:12.5px;
    color:var(--muted);
    white-space:nowrap;
  }
  .clear-btn{
    border:1px solid var(--line);
    background:var(--surface);
    color:var(--muted);
    padding:10px 14px;
    border-radius:var(--radius);
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    white-space:nowrap;
  }
  .clear-btn:hover{border-color:var(--muted-soft);color:var(--ink);}

  /* ---------- RESULTADOS ---------- */
  .results{
    margin-top:8px;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    overflow:hidden;
  }
  .group-title{
    display:flex;
    align-items:baseline;
    gap:10px;
    padding:14px 20px 10px;
    background:#F8F9FB;
    border-bottom:1px solid var(--line);
    border-top:1px solid var(--line);
  }
  .group-title:first-child{border-top:none;}
  .group-title .g-name{
    font-size:12.5px;
    font-weight:700;
    letter-spacing:.05em;
    text-transform:uppercase;
    color:var(--navy);
  }
  .group-title .g-count{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--muted-soft);
  }

  .row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    padding:13px 20px;
    border-bottom:1px solid var(--line);
    animation:fadeIn .25s ease both;
  }
  .row:last-child{border-bottom:none;}
  .row:hover{background:#FAFBFC;}
  .row .nome{
    font-size:14.5px;
    font-weight:600;
    color:var(--ink);
    min-width:0;
    overflow-wrap:break-word;
  }
  .row .setor-inline{
    display:none;
  }
  .ramal{
    flex:0 0 auto;
    font-family:'IBM Plex Mono',monospace;
    font-size:13.5px;
    font-weight:600;
    color:var(--brass-ink);
    background:var(--brass-tint);
    border:1px solid #E9D6AE;
    padding:6px 12px;
    border-radius:999px;
    cursor:pointer;
    position:relative;
    user-select:none;
  }
  .ramal:hover{background:#F1E1BC;}
  .ramal.copied::after{
    content:'Copiado!';
    position:absolute;
    top:-26px;
    right:0;
    background:var(--navy);
    color:#fff;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:11px;
    padding:4px 8px;
    border-radius:6px;
    white-space:nowrap;
    animation:popFade 1.1s ease forwards;
  }
  mark{
    background:var(--brass-tint);
    color:var(--brass-ink);
    border-radius:3px;
    padding:0 1px;
  }

  .empty{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:12px;
    padding:70px 20px;
    color:var(--muted-soft);
    text-align:center;
  }
  .empty svg{width:34px;height:34px;}

  @keyframes fadeIn{from{opacity:0;transform:translateY(2px);}to{opacity:1;transform:translateY(0);}}
  @keyframes popFade{
    0%{opacity:0;transform:translateY(4px);}
    12%{opacity:1;transform:translateY(0);}
    80%{opacity:1;}
    100%{opacity:0;}
  }

  .footer{
    text-align:center;
    font-size:12px;
    color:var(--muted-soft);
    padding:22px 20px 30px;
    border-top:1px solid var(--line);
  }

  @media (prefers-reduced-motion: reduce){
    .row{animation:none;}
    .ramal.copied::after{animation:none;opacity:1;}
  }

  /* ---------- RESPONSIVO ---------- */
  @media (max-width:860px){
    .app{display:block;}
    .rail{
      position:static;
      height:auto;
      flex-direction:row;
      align-items:center;
      overflow-x:auto;
      border-right:none;
      border-bottom:1px solid rgba(0,0,0,.2);
    }
    .brand{
      border-bottom:none;
      border-right:1px solid var(--navy-line);
      padding:16px 18px;
      flex:0 0 auto;
    }
    .brand-logo{max-width:150px;}
    .brand-sub{display:none;}
    .index-scroll{
      display:flex;
      overflow-x:auto;
      overflow-y:hidden;
      padding:0 10px;
      flex:1;
    }
    .index-item{
      width:auto;
      flex:0 0 auto;
      white-space:nowrap;
      border-left:none;
      border-bottom:3px solid transparent;
      padding:14px 12px;
    }
    .index-item.active{border-left:none;border-bottom-color:var(--brass);}
    .index-item.all{
      border-bottom:1px solid transparent;
      margin-bottom:0;
      padding-bottom:14px;
    }
    .main{padding:20px 16px 40px;}
  }
</style>
</head>

const indexList = document.getElementById('index-list');
const searchInput = document.getElementById('search');
const resultsEl = document.getElementById('results');
const countBadge = document.getElementById('count-badge');
const clearBtn = document.getElementById('clear-btn');

let currentSetor = '';

// monta índice de setores com contagem, ordenado
const setores = [...new Set(DATA.map(d => d.setor))].sort((a,b)=>a.localeCompare(b,'pt-BR'));

function buildIndex(){
  indexList.innerHTML = '';

  const allBtn = document.createElement('button');
  allBtn.className = 'index-item all active';
  allBtn.dataset.setor = '';
  allBtn.innerHTML = `<span class="index-label">Todos os setores</span><span class="index-count">${DATA.length}</span>`;
  indexList.appendChild(allBtn);

  for(const s of setores){
    const count = DATA.filter(d => d.setor === s).length;
    const btn = document.createElement('button');
    btn.className = 'index-item';
    btn.dataset.setor = s;
    btn.innerHTML = `<span class="index-label">${s}</span><span class="index-count">${count}</span>`;
    indexList.appendChild(btn);
  }

  indexList.addEventListener('click', (e) => {
    const item = e.target.closest('.index-item');
    if(!item) return;
    currentSetor = item.dataset.setor;
    for(const el of indexList.querySelectorAll('.index-item')) el.classList.remove('active');
    item.classList.add('active');
    render();
  });
}

function normalize(str){
  return (str||'').toString().normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
}

function highlight(text, term){
  if(!term) return text;
  const idx = normalize(text).indexOf(normalize(term));
  if(idx === -1) return text;
  return text.slice(0,idx) + '<mark>' + text.slice(idx, idx+term.length) + '</mark>' + text.slice(idx+term.length);
}

function render(){
  const term = searchInput.value.trim();

  let filtered = DATA.filter(d => {
    const matchesSetor = !currentSetor || d.setor === currentSetor;
    if(!matchesSetor) return false;
    if(!term) return true;
    const t = normalize(term);
    return normalize(d.setor).includes(t) || normalize(d.nome).includes(t) || normalize(d.ramal).includes(t);
  });

  countBadge.textContent = filtered.length + (filtered.length === 1 ? ' contato' : ' contatos');

  resultsEl.innerHTML = '';

  if(filtered.length === 0){
    resultsEl.innerHTML = `
      <div class="empty">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <div>Nenhum resultado encontrado.</div>
      </div>`;
    return;
  }

  const groups = {};
  const order = [];
  for(const item of filtered){
    if(!groups[item.setor]){ groups[item.setor] = []; order.push(item.setor); }
    groups[item.setor].push(item);
  }

  const frag = document.createDocumentFragment();
  for(const setor of order){
    const title = document.createElement('div');
    title.className = 'group-title';
    title.innerHTML = `<span class="g-name">${highlight(setor, term)}</span><span class="g-count">${groups[setor].length}</span>`;
    frag.appendChild(title);

    for(const item of groups[setor]){
      const row = document.createElement('div');
      row.className = 'row';
      row.innerHTML = `
        <div class="nome">${highlight(item.nome, term)}</div>
        <div class="ramal" title="Clique para copiar">${highlight(item.ramal, term)}</div>
      `;
      const ramalEl = row.querySelector('.ramal');
      ramalEl.addEventListener('click', () => {
        navigator.clipboard.writeText(item.ramal).catch(()=>{});
        ramalEl.classList.remove('copied');
        void ramalEl.offsetWidth;
        ramalEl.classList.add('copied');
      });
      frag.appendChild(row);
    }
  }
  resultsEl.appendChild(frag);
}

searchInput.addEventListener('input', render);
clearBtn.addEventListener('click', () => {
  searchInput.value = '';
  currentSetor = '';
  for(const el of indexList.querySelectorAll('.index-item')) el.classList.remove('active');
  indexList.querySelector('.index-item.all').classList.add('active');
  render();
});

buildIndex();
render();
</script>
</body>
</html>
