<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@600;700;800&display=swap');

:root {
  --navy:#071a2e;
  --navy-soft:#0c2845;
  --blue:#1769aa;
  --blue-dark:#105486;
  --accent:#18a1b5;
  --page:#f1f4f7;
  --white:#ffffff;
  --text:#172231;
  --muted:#68788a;
  --line:#dfe5eb;
  --line-dark:#cbd5df;
  --hover:#f5f9fc;
  --pill:#eaf3f9;
  --shadow:0 8px 30px rgba(7,26,46,.07);
}

* { box-sizing:border-box; }
html { scroll-behavior:smooth; }
body {
  margin:0;
  background:var(--page);
  color:var(--text);
  font-family:Inter,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}

button,input { font:inherit; }

.header {
  background:var(--navy);
  color:#fff;
  border-bottom:1px solid rgba(255,255,255,.09);
}

.header-main {
  max-width:1500px;
  min-height:78px;
  margin:auto;
  padding:0 28px;
  display:flex;
  align-items:center;
  gap:22px;
}

.logo {
  width:175px;
  max-height:52px;
  object-fit:contain;
  object-position:left center;
}

.brand-divider {
  width:1px;
  height:34px;
  background:rgba(255,255,255,.18);
}

.brand-text small {
  display:block;
  color:#8fa6bc;
  font-size:10px;
  line-height:1;
  font-weight:700;
  letter-spacing:.17em;
  text-transform:uppercase;
}

.brand-text strong {
  display:block;
  margin-top:5px;
  font:700 18px Manrope,Inter,sans-serif;
  letter-spacing:-.01em;
}

.header-meta {
  margin-left:auto;
  display:flex;
  align-items:center;
  gap:9px;
  color:#a8bbcc;
  font-size:11px;
  font-weight:600;
}

.header-dot {
  width:7px;
  height:7px;
  border-radius:50%;
  background:#45d3a0;
  box-shadow:0 0 0 4px rgba(69,211,160,.12);
}

.page {
  max-width:1500px;
  margin:auto;
  padding:28px;
}

.toolbar {
  background:var(--white);
  border:1px solid var(--line);
  border-radius:16px;
  box-shadow:var(--shadow);
  overflow:hidden;
}

.toolbar-top {
  padding:18px 20px;
  display:grid;
  grid-template-columns:minmax(280px,1fr) auto;
  align-items:center;
  gap:18px;
}

.title-area h1 {
  margin:0;
  font:800 24px Manrope,Inter,sans-serif;
  color:var(--navy);
  letter-spacing:-.035em;
}

.title-area p {
  margin:5px 0 0;
  color:var(--muted);
  font-size:12px;
}

.search-wrap {
  position:relative;
  width:min(540px,100%);
}

.search-icon {
  position:absolute;
  left:14px;
  top:50%;
  transform:translateY(-50%);
  width:18px;
  color:#8191a1;
  pointer-events:none;
}

.search {
  width:100%;
  height:45px;
  padding:0 15px 0 43px;
  border:1px solid var(--line-dark);
  border-radius:11px;
  outline:none;
  background:#fafcfd;
  color:var(--text);
  font-size:13px;
  transition:.18s ease;
}

.search:focus {
  background:#fff;
  border-color:#7da9c7;
  box-shadow:0 0 0 4px rgba(23,105,170,.08);
}

.search::placeholder { color:#8d9aa8; }

.group-bar {
  border-top:1px solid var(--line);
  padding:13px 18px;
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  background:#fbfcfd;
}

.group-btn {
  appearance:none;
  border:1px solid var(--line);
  background:#fff;
  color:#586a7d;
  border-radius:7px;
  padding:7px 10px;
  font-size:10.5px;
  font-weight:700;
  cursor:pointer;
  transition:.15s ease;
  white-space:nowrap;
}

.group-btn:hover {
  border-color:#9dbbd1;
  color:var(--blue);
  background:#f7fbfe;
}

.group-btn.active {
  background:var(--navy);
  border-color:var(--navy);
  color:#fff;
}

.info-row {
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  padding:20px 2px 11px;
}

.info-title {
  font:700 14px Manrope,Inter,sans-serif;
  color:var(--navy);
}

.info-count {
  color:var(--muted);
  font-size:11px;
}

.directory {
  background:var(--white);
  border:1px solid var(--line);
  border-radius:14px;
  box-shadow:var(--shadow);
  overflow:hidden;
}

.table-head {
  display:grid;
  grid-template-columns:minmax(0,1fr) 145px;
  gap:20px;
  padding:10px 20px;
  background:#f6f8fa;
  border-bottom:1px solid var(--line);
  color:#778696;
  font-size:9.5px;
  font-weight:800;
  letter-spacing:.1em;
  text-transform:uppercase;
}

.table-head div:last-child { text-align:right; }

.sector {
  border-bottom:1px solid var(--line);
}

.sector:last-child { border-bottom:0; }

.sector-title {
  min-height:40px;
  padding:0 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:linear-gradient(90deg,#eef5fa 0%,#f8fafc 60%,#fff 100%);
  border-bottom:1px solid var(--line);
}

.sector-name {
  display:flex;
  align-items:center;
  gap:9px;
  color:var(--navy);
  font-size:11px;
  font-weight:800;
  letter-spacing:.035em;
  text-transform:uppercase;
}

.sector-name::before {
  content:"";
  width:3px;
  height:17px;
  border-radius:3px;
  background:var(--blue);
}

.sector-total {
  color:#718194;
  background:#e7eef4;
  border-radius:20px;
  padding:4px 8px;
  font-size:9px;
  font-weight:800;
}

.contact {
  min-height:51px;
  display:grid;
  grid-template-columns:minmax(0,1fr) 145px;
  gap:20px;
  align-items:center;
  padding:8px 20px;
  border-bottom:1px solid #edf0f3;
  transition:background .12s ease;
}

.contact:last-child { border-bottom:0; }

.contact:hover { background:var(--hover); }

.contact-name {
  min-width:0;
  font-size:12.5px;
  font-weight:600;
  color:#243243;
}

.ramal {
  justify-self:end;
  min-width:92px;
  border:1px solid #bddde4;
  background:#eff9fa;
  color:#087082;
  border-radius:7px;
  padding:7px 11px;
  text-align:center;
  font:800 12px ui-monospace,SFMono-Regular,Menlo,monospace;
  cursor:pointer;
  transition:.14s ease;
}

.ramal:hover {
  background:#e1f4f6;
  border-color:#8fc9d2;
  transform:translateY(-1px);
}

.ramal.copied {
  background:var(--navy);
  color:#fff;
  border-color:var(--navy);
}

.empty {
  padding:75px 20px;
  text-align:center;
  color:var(--muted);
}

.empty-icon {
  width:42px;
  height:42px;
  margin:0 auto 12px;
  border-radius:12px;
  display:grid;
  place-items:center;
  background:#eef3f7;
  color:#7c8d9f;
  font-size:22px;
}

.empty strong {
  display:block;
  margin-bottom:5px;
  color:var(--text);
  font-size:13px;
}

.footer {
  padding:25px 0 5px;
  text-align:center;
  color:#8b98a5;
  font-size:10px;
}

.toast {
  position:fixed;
  left:50%;
  bottom:25px;
  transform:translate(-50%,20px);
  opacity:0;
  pointer-events:none;
  background:var(--navy);
  color:#fff;
  border-radius:9px;
  padding:9px 13px;
  font-size:11px;
  font-weight:700;
  box-shadow:0 10px 30px rgba(7,26,46,.2);
  transition:.2s ease;
  z-index:50;
}

.toast.show {
  opacity:1;
  transform:translate(-50%,0);
}

@media(max-width:800px) {
  .header-main { padding:0 17px; }
  .page { padding:18px 16px 35px; }
  .brand-divider,.brand-text { display:none; }
  .logo { width:140px; }
  .header-meta { font-size:10px; }
  .toolbar-top { grid-template-columns:1fr; }
  .search-wrap { width:100%; }
}

@media(max-width:560px) {
  .header-main { min-height:65px; }
  .logo { width:125px; }
  .header-meta { display:none; }
  .title-area h1 { font-size:21px; }
  .info-row { padding-top:17px; }
  .table-head { display:none; }
  .contact { grid-template-columns:minmax(0,1fr) auto; gap:10px; padding:10px 13px; }
  .sector-title { padding:0 13px; }
  .contact-name { font-size:12px; }
  .ramal { min-width:82px; padding:7px 8px; font-size:11px; }
}
</style>

let selectedSector = "";
const searchInput = document.getElementById("search");
const groupsEl = document.getElementById("groups");
const directoryEl = document.getElementById("directory");
const countEl = document.getElementById("count");
const toastEl = document.getElementById("toast");

const normalize = value =>
  String(value).normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();

const sectors = [...new Set(DATA.map(item => item.setor))]
  .sort((a,b) => a.localeCompare(b, "pt-BR"));

function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, char => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#039;"
  })[char]);
}

function getFilteredData() {
  const query = normalize(searchInput.value.trim());

  return DATA.filter(item => {
    const matchesSector = !selectedSector || item.setor === selectedSector;
    const matchesQuery =
      !query ||
      normalize(item.nome).includes(query) ||
      normalize(item.setor).includes(query) ||
      normalize(item.ramal).includes(query);

    return matchesSector && matchesQuery;
  });
}

function renderGroups() {
  groupsEl.innerHTML = "";

  const all = document.createElement("button");
  all.className = "group-btn " + (!selectedSector ? "active" : "");
  all.textContent = `Todos · ${DATA.length}`;
  all.onclick = () => {
    selectedSector = "";
    render();
  };
  groupsEl.appendChild(all);

  sectors.forEach(sector => {
    const button = document.createElement("button");
    button.className = "group-btn " + (selectedSector === sector ? "active" : "");
    button.textContent = `${sector} · ${DATA.filter(item => item.setor === sector).length}`;
    button.onclick = () => {
      selectedSector = sector;
      render();
    };
    groupsEl.appendChild(button);
  });
}

function render() {
  renderGroups();

  const rows = getFilteredData();
  countEl.textContent =
    `${rows.length} contato${rows.length === 1 ? "" : "s"} encontrado${
      rows.length === 1 ? "" : "s"
    }`;

  if (!rows.length) {
    directoryEl.innerHTML = `
      <div class="empty">
        <div class="empty-icon">⌕</div>
        <strong>Nenhum contato encontrado</strong>
        Tente outro nome, setor ou ramal.
      </div>`;
    return;
  }

  const grouped = {};
  rows.forEach(item => {
    if (!grouped[item.setor]) grouped[item.setor] = [];
    grouped[item.setor].push(item);
  });

  directoryEl.innerHTML = Object.entries(grouped).map(([sector, contacts]) => `
    <section class="sector">
      <div class="sector-title">
        <div class="sector-name">${escapeHTML(sector)}</div>
        <div class="sector-total">${contacts.length}</div>
      </div>
      ${contacts.map(item => `
        <div class="contact">
          <div class="contact-name">${escapeHTML(item.nome)}</div>
          <button class="ramal" data-ramal="${escapeHTML(item.ramal)}">
            ${escapeHTML(item.ramal)}
          </button>
        </div>
      `).join("")}
    </section>
  `).join("");

  directoryEl.querySelectorAll(".ramal").forEach(button => {
    button.addEventListener("click", () => copyRamal(button));
  });
}

async function copyRamal(button) {
  const value = button.dataset.ramal;

  try {
    await navigator.clipboard.writeText(value);
  } catch {
    const area = document.createElement("textarea");
    area.value = value;
    document.body.appendChild(area);
    area.select();
    document.execCommand("copy");
    area.remove();
  }

  button.classList.add("copied");
  const original = button.textContent;
  button.textContent = "COPIADO";
  toastEl.classList.add("show");

  setTimeout(() => {
    button.classList.remove("copied");
    button.textContent = original;
    toastEl.classList.remove("show");
  }, 1000);
}

searchInput.addEventListener("input", render);
render();
</script>
