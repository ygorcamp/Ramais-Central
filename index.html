<style>
:root{
  --bg:#dee8f7;
  --panel:#f8fbff;
  --panel2:#e3ecfb;
  --accent:#266bd9;
  --accent2:#1250b3;
  --text:#101a2b;
  --muted:#6a768a;
  --border:#b3c8ea;
  --success:#2fbf71;
}
*{box-sizing:border-box;}
body{
  margin:0;
  font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  background:radial-gradient(circle at 20% -10%, #c6d8f4 0%, var(--bg) 55%);
  color:var(--text);
  min-height:100vh;
  padding:24px 16px 60px;
}
.wrap{max-width:960px;margin:0 auto;}
header{
  text-align:center;
  margin-bottom:28px;
  position:relative;
}
.logo-corner{
  position:absolute;
  top:6px;
  right:-6px;
  height:24px;
  width:auto;
}
header h1{
  font-size:28px;
  margin:0 0 6px;
  background:linear-gradient(90deg,var(--accent),var(--accent2));
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  font-weight:700;
}
header p{color:var(--muted);margin:0;font-size:14px;}

.search-panel{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:16px;
  padding:18px;
  margin-bottom:22px;
  box-shadow:0 10px 30px rgba(38,107,217,.12);
}
.search-box{
  position:relative;
  display:flex;
  align-items:center;
}
.search-box svg{
  position:absolute;
  left:14px;
  width:18px;height:18px;
  color:var(--muted);
}
#search{
  width:100%;
  padding:14px 14px 14px 42px;
  border-radius:12px;
  border:1px solid var(--border);
  background:var(--panel2);
  color:var(--text);
  font-size:16px;
  outline:none;
  transition:border-color .15s, box-shadow .15s;
}
#search:focus{
  border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(38,107,217,.15);
}
.filters{
  display:flex;
  gap:10px;
  margin-top:12px;
  flex-wrap:wrap;
  align-items:center;
}
.filters select{
  flex:1;
  min-width:180px;
  padding:10px 12px;
  border-radius:10px;
  border:1px solid var(--border);
  background:var(--panel2);
  color:var(--text);
  font-size:14px;
}
.stats{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:14px 2px 10px;
  color:var(--muted);
  font-size:13px;
}
#count-badge{
  background:rgba(38,107,217,.1);
  color:var(--accent);
  padding:3px 10px;
  border-radius:20px;
  font-weight:600;
}
.clear-btn{
  background:none;
  border:1px solid var(--border);
  color:var(--muted);
  padding:6px 12px;
  border-radius:8px;
  font-size:13px;
  cursor:pointer;
  transition:.15s;
}
.clear-btn:hover{border-color:var(--accent);color:var(--accent);}

#results{
  display:flex;
  flex-direction:column;
  gap:10px;
}
.group-title{
  font-size:12px;
  text-transform:uppercase;
  letter-spacing:.08em;
  color:var(--accent);
  margin:18px 4px 4px;
  font-weight:700;
}
.group-title:first-child{margin-top:0;}

.card{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:14px;
  padding:14px 16px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  transition:transform .12s, border-color .12s, background .12s;
}
.card:hover{
  transform:translateY(-2px);
  border-color:var(--accent);
  background:var(--panel2);
}
.card .info{min-width:0;}
.card .nome{
  font-size:15px;
  font-weight:600;
  color:var(--text);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.card .setor{
  font-size:12px;
  color:var(--muted);
  margin-top:2px;
}
.card .ramal{
  flex-shrink:0;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#fff;
  font-weight:700;
  font-size:15px;
  padding:8px 14px;
  border-radius:10px;
  letter-spacing:.03em;
  cursor:pointer;
  user-select:all;
  position:relative;
  min-width:100px;
  text-align:center;
}
.card .ramal.copied::after{
  content:'Copiado!';
  position:absolute;
  top:-26px;right:0;
  background:var(--success);
  color:#fff;
  font-size:11px;
  padding:3px 8px;
  border-radius:6px;
  animation:fade .8s ease forwards;
}
@keyframes fade{
  0%{opacity:0;transform:translateY(4px);}
  15%{opacity:1;transform:translateY(0);}
  85%{opacity:1;}
  100%{opacity:0;}
}
.empty{
  text-align:center;
  color:var(--muted);
  padding:60px 20px;
}
.empty svg{width:48px;height:48px;opacity:.4;margin-bottom:12px;}
footer{
  text-align:center;
  color:var(--muted);
  font-size:12px;
  margin-top:36px;
}
mark{
  background:rgba(38,107,217,.25);
  color:var(--accent2);
  border-radius:3px;
  padding:0 2px;
}
@media (max-width:480px){
  .card{padding:12px;}
  .card .ramal{font-size:14px;padding:7px 10px;min-width:88px;}
}
</style>

const searchInput = document.getElementById('search');
const setorFilter = document.getElementById('setor-filter');
const resultsEl = document.getElementById('results');
const countBadge = document.getElementById('count-badge');
const clearBtn = document.getElementById('clear-btn');

// popula filtro de setores
const setores = [...new Set(DATA.map(d => d.setor))].sort((a,b)=>a.localeCompare(b,'pt-BR'));
for(const s of setores){
  const opt = document.createElement('option');
  opt.value = s;
  opt.textContent = s;
  setorFilter.appendChild(opt);
}

function normalize(str){
  return (str||'').toString().normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
}

function highlight(text, term){
  if(!term) return text;
  const idx = normalize(text).indexOf(normalize(term));
  if(idx === -1) return text;
  return text.slice(0,idx) + '<mark>' + text.slice(idx, idx+term.length) + '</mark>' + text.slice(idx+term.length);
}

function render(){
  const term = searchInput.value.trim();
  const setorSel = setorFilter.value;

  let filtered = DATA.filter(d => {
    const matchesSetor = !setorSel || d.setor === setorSel;
    if(!matchesSetor) return false;
    if(!term) return true;
    const t = normalize(term);
    return normalize(d.setor).includes(t) || normalize(d.nome).includes(t) || normalize(d.ramal).includes(t);
  });

  countBadge.textContent = filtered.length + (filtered.length === 1 ? ' contato' : ' contatos');

  resultsEl.innerHTML = '';

  if(filtered.length === 0){
    resultsEl.innerHTML = `
      <div class="empty">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <div>Nenhum resultado encontrado.</div>
      </div>`;
    return;
  }

  // agrupa por setor mantendo ordem original
  const groups = {};
  const order = [];
  for(const item of filtered){
    if(!groups[item.setor]){ groups[item.setor] = []; order.push(item.setor); }
    groups[item.setor].push(item);
  }

  const frag = document.createDocumentFragment();
  for(const setor of order){
    const title = document.createElement('div');
    title.className = 'group-title';
    title.textContent = setor;
    frag.appendChild(title);

    for(const item of groups[setor]){
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="info">
          <div class="nome">${highlight(item.nome, term)}</div>
          <div class="setor">${highlight(item.setor, term)}</div>
        </div>
        <div class="ramal" title="Clique para copiar">${highlight(item.ramal, term)}</div>
      `;
      const ramalEl = card.querySelector('.ramal');
      ramalEl.addEventListener('click', () => {
        navigator.clipboard.writeText(item.ramal).catch(()=>{});
        ramalEl.classList.remove('copied');
        void ramalEl.offsetWidth;
        ramalEl.classList.add('copied');
      });
      frag.appendChild(card);
    }
  }
  resultsEl.appendChild(frag);
}

searchInput.addEventListener('input', render);
setorFilter.addEventListener('change', render);
clearBtn.addEventListener('click', () => {
  searchInput.value = '';
  setorFilter.value = '';
  render();
});

render();
</script>
