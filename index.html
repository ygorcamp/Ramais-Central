  --card:#fff; --text:#182334; --muted:#66758a; --line:#e4eaf1;
  --shadow:0 12px 35px rgba(16,42,67,.08);
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}
header{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;padding:28px 24px 34px}
.header-inner{max-width:1200px;margin:auto}
.badge{display:inline-flex;padding:6px 10px;border:1px solid rgba(255,255,255,.2);border-radius:999px;background:rgba(255,255,255,.08);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.logo{height:38px;display:block}
h1{margin:12px 0 6px;font-size:clamp(26px,4vw,40px);letter-spacing:-.03em}
.subtitle{margin:0;color:#d9e5f3}
main{max-width:1200px;margin:-18px auto 40px;padding:0 18px}
.controls{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:16px;display:grid;grid-template-columns:1fr 220px auto;gap:10px}
input,select,button{height:46px;border-radius:10px;border:1px solid var(--line);font:inherit}
input,select{padding:0 14px;outline:none;background:#fff}
input:focus,select:focus{border-color:#6fa8d8;box-shadow:0 0 0 3px rgba(23,105,170,.1)}
button{padding:0 18px;border:0;background:var(--navy);color:#fff;font-weight:700;cursor:pointer}
button:hover{background:#07172b}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 15px;color:var(--muted);font-size:13px}
.stat strong{color:var(--text);font-size:17px;margin-right:5px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:17px;box-shadow:0 5px 20px rgba(16,42,67,.045);transition:.18s}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.sector{font-size:11px;font-weight:800;color:var(--blue);text-transform:uppercase;letter-spacing:.06em;margin-bottom:9px}
.name{font-size:16px;font-weight:750;line-height:1.35;margin-bottom:13px}
.phone{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:12px;border-top:1px solid var(--line)}
.number{font-size:20px;font-weight:800;color:var(--navy);letter-spacing:.02em}
.empty{display:none;text-align:center;background:#fff;border:1px dashed #cbd6e2;border-radius:14px;padding:40px;color:var(--muted)}
footer{text-align:center;color:#8794a5;font-size:12px;padding:0 20px 25px}
@media(max-width:760px){.controls{grid-template-columns:1fr} .grid{grid-template-columns:1fr}}
</style>
</head>
